server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT 认证配置（T1，SPEC-identity）；生产环境必须用环境变量覆盖 app.jwt.secret
app.jwt.secret=devOnlyExamSystemJwtSecretKey2026PleaseChangeInProduction0123456789
app.jwt.expiration-hours=8

# 种子账号初始密码（Issue1 安全修复）：禁止硬编码弱口令，通过环境变量注入；
# 未配置时系统在首次初始化时随机生成强密码并打印到启动日志（WARN），
# 种子账号首次登录将强制修改密码。
app.security.seed.admin-password=${APP_SECURITY_SEED_ADMIN_PASSWORD:}
app.security.seed.teacher-password=${APP_SECURITY_SEED_TEACHER_PASSWORD:}
app.security.seed.student-password=${APP_SECURITY_SEED_STUDENT_PASSWORD:}

# OpenAPI / Swagger 配置（M5 收尾）
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.defaultModelsExpandDepth=1