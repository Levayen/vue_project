# CI 质量漏斗：后端测试 + 管理端构建 + 象棋端 lint
# 与 .harness/harness.yaml qualityGates 对应
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: backend (Spring Boot / mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven test
        run: mvn -q test

  frontend-admin:
    name: frontend-admin (vue-tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  web-chess:
    name: web-chess (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
